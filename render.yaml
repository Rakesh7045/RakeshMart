# Render Infrastructure-as-Code Blueprint for RAKESH KANNAN MART
services:
  - type: web
    name: RAKESH KANNAN MART
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: DATABASE_URL
        sync: false

